name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit and syntax checks
        run: |
          python3 -m unittest discover -s tests -v
          python3 -m py_compile scripts/*.py images/common/launch.py
          bash -n scripts/*.sh
      - name: Build both images
        run: bash scripts/build.sh
      - name: Verify offline startup and authentication guards
        run: python3 scripts/verify.py
